services:
  app:
    build:
      target: ${APP_TARGET:-develop}
      dockerfile: ./docker/images/php/Dockerfile
      context: ../..
      args:
        - IMAGE_TAG=${APP_VERSION:-0.0.1}
    environment:
      - PHP_DISPLAY_ERRORS=1
      - APP_UID=1000
      - APP_GID=1000
      - APP_USER=devskyfly
      - APP_GROUP=devskyfly
      - SMTP_HOST=${SMTP_HOST:-mail.hosting.reg.ru}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-tls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Сайт filpan.ru}
      - FEEDBACK_RECIPIENT=${FEEDBACK_RECIPIENT:-filpan@yandex.ru}
    restart: unless-stopped
    volumes:
      - ../../app:/var/www/html
#      - /etc/localtime:/etc/localtime:ro
#      - /etc/timezone:/etc/timezone:row
    ports:
      - ${APP_PORT:-8000}:80
